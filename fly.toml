# LAUNCH CONFIG (0.9.15.1, RIDE L1; release lane 4228a395): the release command's throwaway machine gets one dedicated
# core and 15 minutes. Through 0.9.15 these lines lived only in an untracked launch.toml that launchcfg.py built from
# this file at each launch; from 0.9.15.1 they are tracked here (only added lines: nothing else in this file changed).
# Why: on a shared-cpu-1x the release command's seed is held to the 1/16-core baseline (0.9.14 run 1: ~95 s of CPU,
# 11.6 min; Fly v26 failed at the 5 min default; nothing was replaced).
# BeltBattles on Fly: the game page and the ghost API from one small machine, ghosts in Tigris.
# Deploy from this directory (the repo root) after `node deploy/stage.mjs <game.html>`; the exact
# commands, checks, rollback and teardown are in deploy/RUNBOOK.md. The Tigris variables
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL_S3, BUCKET_NAME, and AWS_REGION on
# newer flyctl; the server defaults it to auto) are app secrets set by `fly storage create`; they
# never appear here.

app = "beltbattles"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Every deploy first writes the bundled sample pool into Tigris on a throwaway machine with the
  # app's env and secrets. It prints written/unchanged/removed counts; a failure aborts the deploy.
  release_command = "node /app/dist/ghost-server.mjs seed"
  # LAUNCH CONFIG: the throwaway machine gets one dedicated core (performance-1x, for the seed's ~1 min), and the
  # wait for it is 15 min (it was 5 min).
  release_command_timeout = "15m"

  [deploy.release_command_vm]
    size = "performance-1x"

[env]
  BB_GHOST_STORE = "tigris"
  BB_GHOST_UPLOADS = "open"             # 0.8.0: signed uploads, the budget check, the hero gate and the record check
  BB_GHOST_TRUST_PROXY = "fly"          # rate limit keyed on Fly-Client-IP, in memory only (never logged)
  BB_GHOST_HOST = "0.0.0.0"
  BB_GHOST_PORT = "8080"
  BB_GHOST_STATIC = "/app/public"       # serves /app/public/index.html at / and /index.html
  BB_GHOST_ORIGINS = "https://beltbattles.fly.dev"
  # One machine: every upload goes through this process and is indexed at once, and a deploy (the
  # re-seed) restarts it, so a long TTL only delays out-of-band changes. Each bucket re-list is a
  # Tigris Class A request (10,000 a month are free). Lower it if the app ever runs two machines.
  BB_GHOST_CACHE_TTL_S = "600"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
