# BeltBattles on Fly: the game page and the ghost API from one small machine, ghosts in Tigris.
# Deploy from this directory (the repo root) after `node deploy/stage.mjs <game.html>`; the exact
# commands, checks, rollback and teardown are in deploy/RUNBOOK.md. The Tigris variables
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL_S3, BUCKET_NAME, and AWS_REGION on
# newer flyctl; the server defaults it to auto) are app secrets set by `fly storage create`; they
# never appear here.

app = "beltbattles"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Every deploy first writes the bundled sample pool into Tigris on a throwaway machine with the
  # app's env and secrets. It prints written/unchanged/removed counts; a failure aborts the deploy.
  release_command = "node /app/dist/ghost-server.mjs seed"

[env]
  BB_GHOST_STORE = "tigris"
  BB_GHOST_UPLOADS = "open"             # 0.8.0: signed uploads, the budget check, the hero gate and the record check
  BB_GHOST_TRUST_PROXY = "fly"          # rate limit keyed on Fly-Client-IP, in memory only (never logged)
  BB_GHOST_HOST = "0.0.0.0"
  BB_GHOST_PORT = "8080"
  BB_GHOST_STATIC = "/app/public"       # serves /app/public/index.html at / and /index.html
  BB_GHOST_ORIGINS = "https://beltbattles.fly.dev"
  # One machine: every upload goes through this process and is indexed at once, and a deploy (the
  # re-seed) restarts it, so a long TTL only delays out-of-band changes. Each bucket re-list is a
  # Tigris Class A request (10,000 a month are free). Lower it if the app ever runs two machines.
  BB_GHOST_CACHE_TTL_S = "600"
  # S2: the deck check runs in a worker thread (server/validator.ts): a queue of 16, a 10 s deadline, 503 + Retry-After. Both threads' heaps are bounded by
  # this one flag: it is the main thread's old-space limit and, because Node lets a process-wide --max-old-space-size override a worker's resourceLimits,
  # the worker's too (/v1/health memory.heapLimitMb and .workerHeapLimitMb show the real limits, each with its young generation added). 96 MB suits this
  # 256 MB machine: the cold day-25 check needs under 32 MB of old space in the worker, and the worker's young generation is capped at 8 MB by the server's
  # own default (BB_GHOST_VALIDATE_YOUNG_MB), which is what keeps the check's peak RSS near 135 MB instead of 180. On a 512 MB machine use about 60% of
  # the RAM, "--max-old-space-size=300", and BB_GHOST_VALIDATE_YOUNG_MB = "16". Without the flag the worker gets BB_GHOST_VALIDATE_HEAP_MB (default 64)
  # and the main thread V8's own default. The flag also applies to `fly ssh console` admin runs (set NODE_OPTIONS= to run one without it).
  NODE_OPTIONS = "--max-old-space-size=96"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
