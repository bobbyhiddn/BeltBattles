<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050B12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>BeltBattles</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050b12;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* C1: safe-area insets (notch, cutout, home bar) as padding, so the canvas sits inside them; 0 where there are none.
           game.ts reads this padding back (src/core/safeArea.ts). The --safe-area-inset-* variables are Capacitor's, for an
           Android WebView older than 140 that has no env(). */
        box-sizing: border-box;
        padding-top: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
        padding-right: max(env(safe-area-inset-right, 0px), var(--safe-area-inset-right, 0px));
        padding-bottom: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
        padding-left: max(env(safe-area-inset-left, 0px), var(--safe-area-inset-left, 0px));
      }
      canvas#game {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        outline: none;
      }
      noscript {
        color: #d0ceb7;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game" tabindex="0" aria-label="BeltBattles game"></canvas></div>
    <noscript>BeltBattles needs JavaScript.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
